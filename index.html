let lang='ar';const $=id=>document.getElementById(id);function setOptions(id,first,arr){$(id).innerHTML='';const o=document.createElement('option');o.value='';o.textContent=first;$(id).appendChild(o);arr.forEach((s,i)=>{const x=document.createElement('option');x.value=String(i);x.textContent=s;$(id).appendChild(x)})}
function render(){const t=T[lang];const chosen=Array.from({length:Q.length},(_,i)=>document.querySelector(`input[name=\"q${i}\"]:checked`)?.value||'');const profile=['sector','size','age'].map(id=>$(id).value);const wasResult=$('result').style.display==='block';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.style.fontFamily=lang==='ar'?'Tahoma,Arial,sans-serif':'Arial,Tahoma,sans-serif';$('langBtn').textContent=lang==='ar'?'English':'العربية';for(const id of ['title','intro','pill','noticeLabel','notice','profileTitle','profileSub','sectorLabel','sizeLabel','ageLabel','assessmentTitle','assessmentSub','evaluate','reset','resultTitle','scoreLabel','weakTitle','actionTitle','dataTitle','disclaimer','print','edit','footer'])$(id).textContent=t[id];setOptions('sector',t.choose,t.sectors);setOptions('size',t.choose,t.sizes);setOptions('age',t.choose,t.ages);['sector','size','age'].forEach((id,i)=>{if(profile[i]!=='')$(id).value=profile[i]});$('questions').innerHTML='';Q.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<div class="num">${t.qprefix} ${i+1} ${t.of} ${Q.length} • ${x.cat[lang==='ar'?0:1]}</div><p>${x.q[lang==='ar'?0:1]}</p><div class="opts">${x.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j+1}"><span>${a[lang==='ar'?0:1]}</span></label>`).join('')}</div>`;$('questions').appendChild(d);if(chosen[i]){const r=document.querySelector(`input[name=\"q${i}\"][value=\"${chosen[i]}\"]`);if(r)r.checked=true}});$('result').style.display='none';if(wasResult&&chosen.every(Boolean))evaluate()}
function evaluate(){const t=T[lang],vals=[];for(let i=0;i<Q.length;i++){const el=document.querySelector(`input[name="q${i}"]:checked`);if(!el){alert(t.missing);document.querySelectorAll('.q')[i].scrollIntoView({behavior:'smooth',block:'center'});return}vals.push(Number(el.value))}const pct=Math.round(vals.reduce((a,b)=>a+b,0)/(Q.length*3)*100),band=pct<45?0:pct<75?1:2;const sorted=Q.map((q,i)=>({cat:q.cat[lang==='ar'?0:1],key:i,val:vals[i]})).sort((a,b)=>a.val-b.val);const weak=sorted.slice(0,3);$('pct').textContent=pct+'%';$('status').textContent=t.status[band];$('statusText').textContent=t.desc[band];$('summaryLead').textContent=t.summary+' '+$('sector').selectedOptions[0].textContent+'.';$('meterFill').style.width=pct+'%';$('weakList').innerHTML=weak.map(x=>`<li><b>${x.cat}:</b> ${t.weak[x.val-1]}</li>`).join('');const acts=[];const keys=weak.map(x=>x.key);if(keys.includes(1))acts.push(t.actions.register);if(keys.some(x=>[0,2,3].includes(x)))acts.push(t.actions.rent);if(keys.includes(4))acts.push(t.actions.maintenance);if(keys.some(x=>[5,6].includes(x)))acts.push(t.actions.cost);if(keys.includes(7))acts.push(t.actions.compliance);if(keys.some(x=>[8,9].includes(x)))acts.push(t.actions.kpi);if(acts.length<3)acts.push(t.actions.follow);$('actionList').innerHTML=[...new Set(acts)].slice(0,4).map(x=>`<li>${x}</li>`).join('');const sector=$('sector').selectedOptions[0].textContent,size=$('size').value===''?t.choose:$('size').selectedOptions[0].textContent,age=$('age').value===''?t.choose:$('age').selectedOptions[0].textContent;$('profileLine').textContent=`${t.activity}: ${sector} • ${t.fleet}: ${size} • ${t.avgAge}: ${age}`;$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'})}
$('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';render()});$('evaluate').addEventListener('click',evaluate);$('reset').addEventListener('click',()=>{document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);$('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})});$('edit').addEventListener('click',()=>$('questions').scrollIntoView({behavior:'smooth',block:'start'}));$('print').addEventListener('click',()=>window.print());render();
</script></body></html>
